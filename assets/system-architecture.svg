  <text x="124" y="536" class="card-title-sm">DataCollector</text>
  <text x="124" y="557" class="body-sm">结构化金融数据与公开资料采集</text>
  <text x="66" y="588" class="body">• 工具选择与多轮 Agent Loop</text>
  <text x="66" y="610" class="body">• 写入统一采集结果与来源信息</text>

  <rect x="450" y="518" width="44" height="44" rx="12" fill="#DBEAFE"/><text x="472" y="546" font-size="23" text-anchor="middle">◎</text>
  <text x="508" y="536" class="card-title-sm">DeepSearchAgent</text>
  <text x="508" y="557" class="body-sm">复杂问题的多轮搜索、阅读与整合</text>
  <text x="450" y="588" class="body">• 搜索引擎、网页抓取、PDF 阅读</text>
  <text x="450" y="610" class="body">• 作为深度检索能力被采集流程调用</text>

  <rect x="834" y="518" width="44" height="44" rx="12" fill="#EDE9FE"/><text x="856" y="546" font-size="22" text-anchor="middle">ƒx</text>
  <text x="892" y="536" class="card-title-sm">DataAnalyzer</text>
  <text x="892" y="557" class="body-sm">数据计算、解释、图表与分析草稿</text>
  <text x="834" y="588" class="body">• pandas / NumPy / Matplotlib</text>
  <text x="834" y="610" class="body">• 受限 Python 代码执行器</text>

  <rect x="1218" y="518" width="44" height="44" rx="12" fill="#CCFBF1"/><text x="1240" y="546" font-size="22" text-anchor="middle">▤</text>
  <text x="1276" y="536" class="card-title-sm">ReportGenerator</text>
  <text x="1276" y="557" class="body-sm">大纲、章节写作、润色与报告后处理</text>
  <text x="1218" y="588" class="body">• 章节级证据检索与引用保持</text>
  <text x="1218" y="610" class="body">• 封面、摘要、参考文献与导出</text>


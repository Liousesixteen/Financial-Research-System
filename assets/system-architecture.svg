  <rect x="24" y="24" width="1552" height="88" rx="20" fill="url(#hero)" filter="url(#shadow)"/>
  <circle cx="70" cy="68" r="22" fill="#FFFFFF" fill-opacity="0.15"/>
  <path d="M58 73 L66 65 L74 70 L84 57" class="line" stroke="#5EEAD4" stroke-width="4"/>
  <circle cx="58" cy="73" r="3" fill="#FFFFFF"/>
  <circle cx="66" cy="65" r="3" fill="#FFFFFF"/>
  <circle cx="74" cy="70" r="3" fill="#FFFFFF"/>
  <circle cx="84" cy="57" r="3" fill="#FFFFFF"/>
  <text x="108" y="61" class="title">Financial Research System · 系统架构</text>
  <text x="108" y="87" class="subtitle">异步多 Agent 研究编排 · Agentic RAG · 可恢复状态 · 可审计证据链</text>
  <g transform="translate(1202,48)">
    <rect width="108" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="54" y="18" class="white-pill" text-anchor="middle">Python / asyncio</text>
    <rect x="118" width="95" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="165.5" y="18" class="white-pill" text-anchor="middle">FastAPI</text>
    <rect x="223" width="104" height="27" rx="13.5" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="275" y="18" class="white-pill" text-anchor="middle">React 18</text>
  </g>


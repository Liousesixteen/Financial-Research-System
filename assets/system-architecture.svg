  <circle cx="88" cy="362" r="20" fill="#2563EB"/><text x="88" y="366" class="number" text-anchor="middle">02</text>
  <text x="120" y="362" class="card-title">LangGraph Research Workflow</text>
  <text x="120" y="387" class="body">以持久状态图推进规划、检索、采集、分析、报告与审计，并在采集/分析节点内并发执行。</text>
  <g transform="translate(120,404)">

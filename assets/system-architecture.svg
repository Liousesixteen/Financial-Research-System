<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Financial Research System 系统架构</title>
  <desc id="desc">展示 Web 与命令行入口、FastAPI 服务、LangGraph 状态工作流、四类 Agent、工具系统、知识库、模型网关、变量记忆以及报告和证据审计输出。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F9FF"/>
      <stop offset="55%" stop-color="#F8FBFF"/>
      <stop offset="100%" stop-color="#F2FAF8"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="52%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="orchestrator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0F9F8F"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .subtitle { font: 400 15px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #DCE7FF; }
      .layer { font: 700 14px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; letter-spacing: 1.5px; }
      .card-title { font: 700 18px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172554; }
      .card-title-sm { font: 700 16px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172554; }
      .body { font: 400 13px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526175; }
      .body-sm { font: 400 12px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748B; }
      .pill { font: 600 12px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1E3A8A; }
      .white-pill { font: 600 12px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #E0F2FE; }
      .number { font: 700 12px Inter, Arial, sans-serif; fill: #FFFFFF; }
      .output { font: 700 15px Inter, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #FFFFFF; }
      .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>


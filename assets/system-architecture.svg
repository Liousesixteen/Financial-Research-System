  <text x="113" y="193" class="card-title">React Web Console</text>
  <text x="113" y="217" class="body">系统配置 · 研究任务 · 实时执行 · 报告预览 · 知识库管理</text>
  <rect x="113" y="232" width="92" height="22" rx="11" fill="#EEF2FF"/><text x="159" y="247" class="pill" text-anchor="middle">Ant Design</text>
  <rect x="215" y="232" width="86" height="22" rx="11" fill="#EEF2FF"/><text x="258" y="247" class="pill" text-anchor="middle">React Router</text>

    <rect y="45" width="145" height="31" rx="15.5" fill="#FFFFFF" stroke="#BFDBFE"/><text x="72.5" y="65" class="pill" text-anchor="middle">动态任务生成</text>
    <rect x="158" y="45" width="130" height="31" rx="15.5" fill="#FFFFFF" stroke="#BFDBFE"/><text x="223" y="65" class="pill" text-anchor="middle">LangChain Retriever</text>
    <rect x="301" y="45" width="157" height="31" rx="15.5" fill="#FFFFFF" stroke="#A7F3D0"/><text x="379.5" y="65" class="pill" text-anchor="middle">状态事件与失败隔离</text>
